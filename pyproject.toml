[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authorship"
version = "0.1.0"
description = "Authorship verification for Ukrainian texts using a Siamese BiLSTM network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "ollama>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
authorship = "authorship.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 60
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "C901",   # mccabe complexity
    "PTH",    # use pathlib over os.path
    "TCH",    # type-checking imports
    "TID",    # tidy imports
    "PLC0415", # import outside top-level
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", "RUF002", "RUF003", # ambiguous Unicode in Ukrainian text data
]

[tool.ruff.lint.isort]
known-first-party = ["authorship"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
